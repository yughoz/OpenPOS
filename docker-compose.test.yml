# Instance OpenPOS kedua untuk testing restore — TERPISAH total dari utama.
#
# Jalankan:   docker compose -p openpos-test -f docker-compose.test.yml up -d --build
# Matikan:    docker compose -p openpos-test -f docker-compose.test.yml down
#
# - PocketBase test : http://127.0.0.1:8095  (admin UI: /_/)
# - App test        : http://127.0.0.1:3001
# - Volume terpisah (pb_data_test) → data utama tidak tersentuh.
# - Superuser dipakai dari .env (sama dengan utama) agar backup yang
#   di-restore tidak mengunci akses admin.
services:
  pocketbase:
    build:
      context: .
      dockerfile: Dockerfile.pocketbase
    restart: unless-stopped
    # entrypoint memakai ini untuk superuser upsert saat boot
    environment:
      PB_SUPERUSER_EMAIL: ${PB_SUPERUSER_EMAIL}
      PB_SUPERUSER_PASSWORD: ${PB_SUPERUSER_PASSWORD}
    volumes:
      - pb_data_test:/pb_data
    ports:
      - "127.0.0.1:8095:8094"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8094/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      pocketbase:
        condition: service_healthy
    environment:
      POCKETBASE_URL: http://pocketbase:8094
      PB_SUPERUSER_EMAIL: ${PB_SUPERUSER_EMAIL}
      PB_SUPERUSER_PASSWORD: ${PB_SUPERUSER_PASSWORD}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:3001:3000"

volumes:
  pb_data_test:
