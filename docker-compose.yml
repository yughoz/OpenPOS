services:
  pocketbase:
    build:
      context: .
      dockerfile: Dockerfile.pocketbase
    restart: unless-stopped
    volumes:
      - pb_data:/pb_data
    ports:
      - "127.0.0.1:8094:8094"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8094/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      pocketbase:
        condition: service_healthy
    environment:
      POCKETBASE_URL: http://pocketbase:8094
      PB_SUPERUSER_EMAIL: ${PB_SUPERUSER_EMAIL}
      PB_SUPERUSER_PASSWORD: ${PB_SUPERUSER_PASSWORD}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
    ports:
      - "3000:3000"

volumes:
  pb_data:
